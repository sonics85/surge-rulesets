name: Update RU ASN ruleset
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert
        run: |
          set -euo pipefail
          {
            echo "# RU ASN prefixes (auto-generated; DO NOT EDIT)"
            echo "# Source: mrixs/ru_asn_prefixes (RIPE NCC, daily refresh)"
            echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            curl -fsSL --max-time 60 https://raw.githubusercontent.com/mrixs/ru_asn_prefixes/master/ipv4_ru.txt \
              | awk 'NF && !/^#/ {printf "IP-CIDR,%s,no-resolve\n", $1}'
            echo
            curl -fsSL --max-time 60 https://raw.githubusercontent.com/mrixs/ru_asn_prefixes/master/ipv6_ru.txt \
              | awk 'NF && !/^#/ {printf "IP-CIDR6,%s,no-resolve\n", $1}'
          } > ru-asn-prefixes.list

          v4=$(grep -c '^IP-CIDR,' ru-asn-prefixes.list || true)
          v6=$(grep -c '^IP-CIDR6,' ru-asn-prefixes.list || true)
          if [ "$v4" -lt 1000 ]; then
            echo "ERROR: only $v4 IPv4 entries"
            exit 1
          fi
          echo "v4=$v4 v6=$v6"

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain ru-asn-prefixes.list)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ru-asn-prefixes.list
            git commit -m "chore: refresh ru-asn-prefixes ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
